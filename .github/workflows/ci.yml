name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ClinicalGrpcService.slnx

      - name: Build
        run: dotnet build ClinicalGrpcService.slnx -c Release --no-restore

      - name: Build Docker image
        run: docker build -f ClinicalGrpcService.Grpc/Dockerfile -t clinicalgrpcservice:ci .
