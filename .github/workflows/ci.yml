name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ClinicalGrpcService.slnx

      - name: Build
        run: dotnet build ClinicalGrpcService.slnx -c Release --no-restore

      - name: Build gRPC service image
        run: docker build -f ClinicalGrpcService.Grpc/Dockerfile -t clinicalgrpcservice:ci .

      - name: Build Clinical API image
        run: docker build -f ClinicalService.Api/Dockerfile -t clinicalservice-api:ci .